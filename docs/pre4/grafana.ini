# /etc/grafana/grafana.ini  (Grafana 13.3.0, Raspberry Pi)
# Nomes les linies que s'han activat. La resta del fitxer son els valors per defecte,
# comentats amb ";". L'original es va desar a /etc/grafana/grafana.ini.orig

[server]
# Grafana a http://<IP del Raspberry>:3000
http_port = 3000

[analytics]
# No enviar estadistiques d'us a Grafana Labs
reporting_enabled = false

[security]
# Usuari administrador. La contrasenya es canvia el primer cop que s'entra i no va al fitxer
admin_user = admin

[users]
# Ningu es pot crear un compte: els usuaris els crea l'administrador
allow_sign_up = false

[auth.anonymous]
# No es pot veure res sense iniciar sessio
enabled = false
