# /etc/mosquitto/conf.d/p3.conf

# Escolta al port 1883 a totes les interficies
listener 1883

# Ningu no entra sense usuari i contrasenya
allow_anonymous false
password_file /etc/mosquitto/passwd

# Que pot fer cada usuari
acl_file /etc/mosquitto/acl

# Guarda els retinguts i les sessions al disc
persistence true
