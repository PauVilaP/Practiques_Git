# /etc/influxdb/influxdb.conf  (InfluxDB 1.8.10, Raspberry Pi)
# Nomes les linies actives. La resta del fitxer son els valors per defecte, comentats.

# No enviar estadistiques d'us a InfluxData
reporting-disabled = true

[meta]
  # Usuaris, bases de dades i politiques de retencio
  dir = "/var/lib/influxdb/meta"

[data]
  # Dades (fitxers TSM) i registre d'escriptura (WAL)
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  series-id-set-cache-size = 100

[retention]
  # Per defecte activat: cada 30 min esborra el que surt de cada politica de retencio

[http]
  # Port 8086 per defecte. Sense usuari i contrasenya no s'hi pot entrar
  auth-enabled = true

[continuous_queries]
  # Per defecte activades: hi anira la consulta continua que omple la politica freda (P4)
